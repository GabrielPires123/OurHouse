<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrinho de Compras</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
</head>

<body>
    <header>
        <nav class="navbar navbar-expand-lg navbar-light" style="background-color: #aa1917;">
            <div class="container-fluid">
                <a class="navbar-brand text-light" href="#">OurHouse</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                    data-bs-target="#navbarNavDropdown" aria-controls="navbarNavDropdown" aria-expanded="false"
                    aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNavDropdown">
                    <ul class="navbar-nav">
                        <li class="nav-item">
                            <a class="nav-link active text-light" aria-current="page" href="index.html">Home</a>
                        </li>
                    </ul>
                </div>
                <button class="btn btn-dark" data-bs-toggle="modal" data-bs-target="#cartModal">
                    🛒 Carrinho <span class="badge bg-danger">2</span>
                </button>
            </div>
        </nav>
    </header>

    <main class="container mt-4">
        <h2 class="text-center">Carrinho de Compras</h2>

        <div class="row">
            <div class="col-md-8">
                <!-- Lista de Produtos no Carrinho -->
                <ul class="list-group">
                    <li class="list-group-item d-flex justify-content-between align-items-center">
                        <div class="d-flex align-items-center">
                            <img src="img/CasaAluguel/1a.jpg" alt="Residencial - Apartamento" width="200" height="120" class="me-3 rounded">
                            <div>
                                <h6 class="mb-1">Residencial - Apartamento</h6>
                                <small class="text-muted">Cascata, Marília - SP | CÓD.: 8979</small>
                                <p class="mb-0 mt-2 text-muted">R$ 499.287,20</p>
                            </div>
                        </div>

                    </li>
                </ul>
            </div>
            <div class="col-md-4">
                <!-- Resumo do Carrinho -->
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">Resumo</h5>
                        <p class="card-text"><strong>R$ 499.287,20</strong></p>
                        <button class="btn btn-outline-secondary w-100">Finalizar Compra</button>
                    </div>
                </div>
            </div>
        </div>
        
    </main>

  <!-- Rodapé -->
    <footer class="container text-center py-4 mt-4 border-top">
        <p>&copy; 2025 - Loja Online. Todos os direitos reservados.</p>
    </footer>
    
 <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
        crossorigin="anonymous"></script>
</body>

</html>
